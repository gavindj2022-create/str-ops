name = "str-ops"
main = "worker/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# One Worker owns the API, scheduled sync, and static PWA assets.
# Replace this local placeholder after `wrangler d1 create str-ops`.
[[d1_databases]]
binding = "DB"
database_name = "str-ops"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "str-ops-photos"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/30 * * * *"]

[vars]
APP_ENV = "development"
WATER_TEST_CADENCE_DAYS = "2"
APP_TIMEZONE = "America/Chicago"

# Secrets are set with `wrangler secret put NAME`. Never commit their values.
# Required:
#   SESSION_SECRET
# Optional live-calendar secrets:
#   ICAL_MILPOINT_AIRBNB, ICAL_MILPOINT_VRBO, ICAL_WESTGATE_AIRBNB,
#   ICAL_GALENA_AIRBNB, ICAL_GALENA_VRBO, ICAL_HICKORY_AIRBNB,
#   ICAL_HICKORY_VRBO
# Optional Web Push:
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
